name: Release

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  WAILS_VERSION: v3.0.0-beta.18
  SWITCH_CODEX_TAGGED_BUILD: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Install Wails Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install pinned Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}
        env:
          GOBIN: ${{ github.workspace }}/.cache/tools

      - name: Run required checks
        run: |
          npm run lint
          npm test
          npm run build:web
          npm run bindings:check
          go test ./...
          go vet ./...
          go test -race ./internal/...

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac-arm64
            os: macos-15
            script: build:mac:arm
          - name: mac-x64
            os: macos-15-intel
            script: build:mac:x64
          - name: win-x64
            os: windows-latest
            script: build:win:x64
          - name: linux-x64
            os: ubuntu-24.04
            script: build:linux:x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
        env:
          GOBIN: ${{ github.workspace }}/.cache/tools

      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis --no-progress -y

      - name: Install Wails Linux build and smoke-test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev desktop-file-utils xvfb xauth dbus-x11

      - name: Build production package
        run: npm run ${{ matrix.script }}

      - name: Validate Linux package metadata and contents
        if: runner.os == 'Linux'
        shell: bash
        run: |
          PACKAGE=$(find release -maxdepth 1 -name 'Switch-Codex-*-linux-amd64.deb' -print -quit)
          test -n "$PACKAGE"
          test "$(dpkg-deb -f "$PACKAGE" Package)" = "switch-codex"
          test "$(dpkg-deb -f "$PACKAGE" Architecture)" = "amd64"
          test "$(dpkg-deb -f "$PACKAGE" Version)" = "$(node -p "require('./package.json').version")-1"
          DEPENDS=$(dpkg-deb -f "$PACKAGE" Depends)
          [[ "$DEPENDS" == *"libgtk-4-1"* ]]
          [[ "$DEPENDS" == *"libwebkitgtk-6.0-4"* ]]
          desktop-file-validate build/linux/switch-codex.desktop
          dpkg-deb -c "$PACKAGE" > /tmp/switch-codex-package-contents.txt
          grep -q './usr/bin/switch-codex' /tmp/switch-codex-package-contents.txt
          grep -q './usr/share/applications/switch-codex.desktop' /tmp/switch-codex-package-contents.txt
          grep -q './usr/share/icons/hicolor/256x256/apps/switch-codex.png' /tmp/switch-codex-package-contents.txt

      - name: Smoke test Linux package on Ubuntu 24.04
        if: runner.os == 'Linux'
        shell: bash
        run: |
          PACKAGE=$(find release -maxdepth 1 -name 'Switch-Codex-*-linux-amd64.deb' -print -quit)
          sudo apt-get install --no-install-recommends -y "$PWD/$PACKAGE"
          SMOKE_DATA=$(mktemp -d)
          set +e
          CODEX_SWITCH_DATA_DIR="$SMOKE_DATA" timeout 15s dbus-run-session -- xvfb-run -a /usr/bin/switch-codex > /tmp/switch-codex-ubuntu-smoke.log 2>&1
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 124 ]; then
            cat /tmp/switch-codex-ubuntu-smoke.log
            exit 1
          fi

      - name: Smoke test Linux package on Debian 13
        if: runner.os == 'Linux'
        shell: bash
        run: |
          PACKAGE=$(find release -maxdepth 1 -name 'Switch-Codex-*-linux-amd64.deb' -print -quit)
          docker run --rm -e PACKAGE_PATH="/workspace/$PACKAGE" -v "$PWD:/workspace:ro" debian:13-slim bash -lc '
            apt-get update
            apt-get install --no-install-recommends -y "$PACKAGE_PATH" xvfb xauth dbus-x11
            mkdir -p /tmp/switch-codex-data
            set +e
            CODEX_SWITCH_DATA_DIR=/tmp/switch-codex-data timeout 15s dbus-run-session -- xvfb-run -a /usr/bin/switch-codex > /tmp/switch-codex-debian-smoke.log 2>&1
            STATUS=$?
            set -e
            if [ "$STATUS" -ne 124 ]; then
              cat /tmp/switch-codex-debian-smoke.log
              exit 1
            fi
          '

      - name: Upload package
        id: upload-package
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: switch-codex-${{ matrix.name }}
          path: release/*
          if-no-files-found: error
          overwrite: true

      - name: Wait before retry upload
        if: steps.upload-package.outcome == 'failure'
        shell: bash
        run: sleep 5

      - name: Retry upload package
        if: steps.upload-package.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: switch-codex-${{ matrix.name }}
          path: release/*
          if-no-files-found: error
          overwrite: true

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Determine release tag
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            PUSHED_TAG="${GITHUB_REF#refs/tags/}"
            test "$PUSHED_TAG" = "$TAG" || { echo "Tag $PUSHED_TAG does not match package version $VERSION"; exit 1; }
            test "$(git rev-parse "$TAG^{commit}")" = "$(git rev-parse HEAD)" || { echo "$TAG does not point to this commit"; exit 1; }
          else
            test -z "$(git tag --list "$TAG")" || { echo "$TAG already exists; bump package.json"; exit 1; }
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download all packages
        id: download-packages
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: switch-codex-*
          path: release
          merge-multiple: true

      - name: Wait before retry download
        if: steps.download-packages.outcome == 'failure'
        shell: bash
        run: sleep 5

      - name: Retry download all packages
        if: steps.download-packages.outcome == 'failure'
        uses: actions/download-artifact@v7
        with:
          pattern: switch-codex-*
          path: release
          merge-multiple: true

      - name: Create GitHub Release after all packages pass
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          files: release/*
          fail_on_unmatched_files: true
