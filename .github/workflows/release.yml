name: Release

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  WAILS_VERSION: v3.0.0-beta.18
  SWITCH_CODEX_TAGGED_BUILD: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}
        env:
          GOBIN: ${{ github.workspace }}/.cache/tools

      - name: Run required checks
        run: |
          npm run lint
          npm test
          npm run build:web
          npm run bindings:check
          go test ./...
          go vet ./...
          go test -race ./internal/...

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac-arm64
            os: macos-15
            script: build:mac:arm
          - name: mac-x64
            os: macos-15-intel
            script: build:mac:x64
          - name: win-x64
            os: windows-latest
            script: build:win:x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
        env:
          GOBIN: ${{ github.workspace }}/.cache/tools

      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis --no-progress -y

      - name: Build production package
        run: npm run ${{ matrix.script }}

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: switch-codex-${{ matrix.name }}
          path: release/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Determine release tag
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            PUSHED_TAG="${GITHUB_REF#refs/tags/}"
            test "$PUSHED_TAG" = "$TAG" || { echo "Tag $PUSHED_TAG does not match package version $VERSION"; exit 1; }
            test "$(git rev-parse "$TAG^{commit}")" = "$(git rev-parse HEAD)" || { echo "$TAG does not point to this commit"; exit 1; }
          else
            test -z "$(git tag --list "$TAG")" || { echo "$TAG already exists; bump package.json"; exit 1; }
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download all packages
        uses: actions/download-artifact@v7
        with:
          pattern: switch-codex-*
          path: release
          merge-multiple: true

      - name: Create GitHub Release after all packages pass
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          files: release/*
          fail_on_unmatched_files: true
