name: Checks

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*.*.*"
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Install Wails Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install pinned Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.18
        env:
          GOBIN: ${{ github.workspace }}/.cache/tools

      - name: Check frontend and version metadata
        run: npm run lint

      - name: Test frontend bridge
        run: npm test

      - name: Build frontend
        run: npm run build:web

      - name: Check generated Wails bindings
        run: npm run bindings:check

      - name: Test Go packages
        run: go test ./...

      - name: Vet Go packages
        run: go vet ./...

      - name: Detect core package data races
        run: go test -race ./internal/...
