version: '3'
# Build and platform version metadata are generated from package.json.
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - .cache
      - node_modules
      - src
      - src-tauri
      - data
      - dist
      - bin
      - release
    file:
      - .DS_Store
      - '*_test.go'
    watched_extension:
      - '*.go'
    git_ignore: true
  executes:
    - cmd: wails3 task build DEV=true
      type: blocking
    - cmd: wails3 task dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
