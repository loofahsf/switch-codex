[package]
name = "switch-codex"
version = "0.0.0"
edition = "2021"

[[bin]]
name = "switch-codex"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
open = "5.3"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
chrono = { version = "0.4", features = ["clock"], default-features = false }
tokio = { version = "1", features = ["sync"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
futures-util = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSOpenPanel", "NSSavePanel", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSURL"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
